name: chart
description: "AI-powered financial chart analysis tool for Crypto, Forex, and Stocks."
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Image
  image_picker: ^1.1.2
  screenshot: ^3.0.0
  receive_sharing_intent: ^1.8.0

  # Storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # Charts
  candlesticks: ^2.1.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.4
  share_plus: ^10.1.2
  package_info_plus: ^8.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

  # ── Monetization ─────────────────────────────────────────────────────────────
  # IAP / Subscriptions
  purchases_flutter: ^9.11.1         # RevenueCat SDK

  # Ads — upgraded to ^7.0.0 for AdManagerAdRequest / custom native factory support
  google_mobile_ads: ^8.0.0

  # Notifications (price alerts)
  flutter_local_notifications: ^17.2.4

  # Timezone support for scheduled notifications
  timezone: ^0.9.4

  # ── Firebase ──────────────────────────────────────────────────────────────────
  firebase_core: ^3.0.0
  firebase_remote_config: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
